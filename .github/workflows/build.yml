name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/AiPaiLink.Client/AiPaiLink.Client.csproj -c Release

      - name: Publish (single file, win-x64)
        run: >
          dotnet publish src/AiPaiLink.Client/AiPaiLink.Client.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # 把要分发的产物单独放一个目录：只签这个目录里的东西
      - name: Collect artifacts
        run: |
          mkdir artifacts
          copy publish\AiPaiLink.exe artifacts\
          copy THIRD_PARTY_NOTICES.md artifacts\
          copy docs\使用说明.txt artifacts\

      # ---- 代码签名（SignPath Foundation 批准后打开这段，并在仓库 Secrets 里配好三项）----
      # 需要的 Secrets：
      #   SIGNPATH_API_TOKEN      SignPath 里生成的 CI 用户 token
      #   SIGNPATH_ORG_ID         组织 ID
      #   SIGNPATH_PROJECT_SLUG   项目 slug
      #   SIGNPATH_POLICY_SLUG    签名策略 slug（例如 release-signing）
      # - name: Submit signing request
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: artifacts-signed

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: AiPaiLink-win-x64-unsigned
          path: artifacts/

      # 打了 tag 时顺手发一个 Release（签名接好之后把 path 换成签名产物目录）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
