name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Windows：WPF 客户端，单文件发布
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/windows/AiPaiLink.Client/AiPaiLink.Client.csproj -c Release

      - name: Publish (single file, win-x64)
        run: >
          dotnet publish src/windows/AiPaiLink.Client/AiPaiLink.Client.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # 把要分发的产物单独放一个目录：只签这个目录里的东西
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish\AiPaiLink.exe artifacts\
          Copy-Item THIRD_PARTY_NOTICES.md artifacts\
          Copy-Item docs\windows-使用说明.txt artifacts\

      # ---- 代码签名（SignPath Foundation 批准后打开这段，并在仓库 Secrets 里配好四项）----
      # 需要的 Secrets：
      #   SIGNPATH_API_TOKEN      SignPath 里生成的 CI 用户 token
      #   SIGNPATH_ORG_ID         组织 ID
      #   SIGNPATH_PROJECT_SLUG   项目 slug
      #   SIGNPATH_POLICY_SLUG    签名策略 slug（例如 release-signing）
      # - name: Submit signing request
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: artifacts-signed

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: AiPaiLink-win-x64-unsigned
          path: artifacts/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # ------------------------------------------------------------------
  # Linux / NAS：命令行 + 网页面板，自包含单文件，连引擎一起打包
  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (single file, linux-x64)
        run: >
          dotnet publish src/linux/AipaiNet.Linux/AipaiNet.Linux.csproj -c Release -r linux-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o dist/aipai

      - name: Fetch EasyTier engine
        run: |
          chmod +x tools/fetch-engine.sh
          ./tools/fetch-engine.sh dist/aipai/engine x86_64

      - name: Pack
        run: |
          set -e
          PKG="艾派互联-linux-x64"
          rm -rf "dist/$PKG"
          mkdir -p "dist/$PKG"
          cp dist/aipai/aipai "dist/$PKG/"
          cp -r dist/aipai/engine "dist/$PKG/engine"
          cp src/linux/install.sh src/linux/install-online.sh "dist/$PKG/"
          cp src/linux/README.md "dist/$PKG/使用说明.md"
          cp "src/linux/飞牛NAS安装说明.md" "dist/$PKG/"
          cp THIRD_PARTY_NOTICES.md "dist/$PKG/"
          chmod +x "dist/$PKG/install.sh" "dist/$PKG/install-online.sh"
          tar -czf "艾派互联-linux-x64.tar.gz" -C dist "$PKG"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AiPaiLink-linux-x64
          path: 艾派互联-linux-x64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 艾派互联-linux-x64.tar.gz

  # ------------------------------------------------------------------
  # Android：VpnService + EasyTier JNI，原生库已提交在 jniLibs/
  # 没有证书时产出未签名 APK，只做编译验证
  # ------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它内部会执行 sdkmanager "tools"，
      # 而新版 cmdline-tools 里已经没有 tools 这个包，action 自己会失败。
      # runner 镜像本来就带 Android SDK，这里只补装我们需要的两个包。
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            echo "找不到 sdkmanager，SDK 目录：$SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble
        working-directory: src/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AiPaiLink-android-unsigned
          path: src/android/app/build/outputs/apk/release/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/android/app/build/outputs/apk/release/*.apk
